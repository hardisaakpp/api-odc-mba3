# MBA3 Consultas — Infraestructura local (Redis + MinIO)
#
# La API y Celery se ejecutan en el host (p. ej. .\run-dev.ps1 y worker en otra terminal).
# Uso: docker compose up -d
#
# Puertos: Redis 6379, MinIO API 9100, consola MinIO 9101.
# Alinear .env.develop: REDIS_URL=redis://localhost:6379/0, FILE_STORAGE_ENDPOINT=http://localhost:9100

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:

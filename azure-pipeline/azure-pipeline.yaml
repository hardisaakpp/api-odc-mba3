# Disparador para Integración Continua
trigger:
  branches:
    include:
      - main
      - test
      - ci/*
      - feature/*
      - fix/*
      - bugfix/*
      - hotfix/*

# Enrutamiento al servidor Ubuntu
pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  - group: acr-credentials
  - name: buildConfiguration
    value: 'Release'
  - name: pythonVersion
    value: '3.10'
  - name: imageName
    value: 'dockermg-g9hrgcc4etdrh8eg.azurecr.io/api-odc-mba3'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/Dockerfile'
  - ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    - name: envTag
      value: 'prod-latest'
    - name: uniqueTag
      value: 'prod-$(Build.BuildId)'
  - ${{ elseif eq(variables['Build.SourceBranchName'], 'test') }}:
    - name: envTag
      value: 'test-latest'
    - name: uniqueTag
      value: 'test-$(Build.BuildId)'
  - ${{ else }}:
    - name: envTag
      value: 'none'
    - name: uniqueTag
      value: 'none'

stages:
# =====================================================================
# ETAPA 1: VALIDACIÓN DE CÓDIGO Y PRUEBAS (CI Puro para Python)
# =====================================================================
- stage: CI_Code_Quality
  displayName: 'Integración Continua - Calidad y Pruebas'
  jobs:
  - job: Validar_Y_Probar
    displayName: 'Revisión y Pruebas Unitarias'
    steps:
    
    # 1. Configurar SDK de Python
    - task: UsePythonVersion@0
      displayName: 'Setup Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    # 2. Restaurar dependencias
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt || pip install -r requirements.txt
      displayName: 'Restore dependencies'

    # 3. Validación de sintaxis
    - script: |
        echo "Validando sintaxis de Python..."
        find src -name "*.py" -exec python -m py_compile {} +
      displayName: 'Validación de sintaxis'

    # 4. Pruebas Unitarias (DESACTIVADAS TEMPORALMENTE)
    # - script: |
    #     pytest tests/ --junitxml=junit/test-results.xml
    #   displayName: 'Run Unit Tests'
    # - task: PublishTestResults@2
    #   inputs:
    #     testResultsFormat: 'JUnit'
    #     testResultsFiles: '**/test-results.xml'
    #   displayName: 'Publicar resultados de pruebas'

# =====================================================================
# ETAPA 2: CONSTRUCCIÓN Y PUBLICACIÓN EN AZURE CONTAINER REGISTRY
# =====================================================================
- stage: Build_Docker
  displayName: 'Construcción de Imagen Docker'
  dependsOn: CI_Code_Quality
  # Bloqueo: Solo construye Docker si la Etapa 1 pasó Y si no estamos en rama feature/fix
  condition: and(succeeded(), ne(variables.envTag, 'none'))
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push Docker Azure'
    steps:

    # [ESTANDARIZACIÓN 1]: Autenticación segura, Build y Push
    - bash: |
        set -euo pipefail
        
        echo "=== 1. Autenticando en Azure Container Registry ==="
        printf '%s' "$ACR_PASSWORD" | docker login dockermg-g9hrgcc4etdrh8eg.azurecr.io -u "$ACR_USERNAME" --password-stdin

        echo "=== 2. Construyendo imagen Docker para la API api-odc-mba3 ($ENV_TAG) ==="
        docker build -f $DOCKERFILE_PATH \
          -t $IMAGE_NAME:$UNIQUE_TAG \
          -t $IMAGE_NAME:$ENV_TAG \
          $(Build.SourcesDirectory)
          
        echo "=== 3. Subiendo imágenes al registro corporativo en la nube ==="
        docker push $IMAGE_NAME:$UNIQUE_TAG
        docker push $IMAGE_NAME:$ENV_TAG
      displayName: 'Empaquetar y Almacenar Contenedor en Azure'
      env:
        ACR_USERNAME: $(acrUsername)
        ACR_PASSWORD: $(acrPassword)
        ENV_TAG: $(envTag)
        UNIQUE_TAG: $(uniqueTag)
        IMAGE_NAME: $(imageName)
        DOCKERFILE_PATH: $(dockerfilePath)

    # [ESTANDARIZACIÓN 2]: Generación del artefacto de texto inmutable
    - bash: |
        set -euo pipefail
        mkdir -p $(Build.ArtifactStagingDirectory)/deploy-info
        echo "$(uniqueTag)" > $(Build.ArtifactStagingDirectory)/deploy-info/image-tag.txt
        echo "Tag publicado para CD: $(uniqueTag)"
      displayName: 'Generar metadata de despliegue'

    # [ADICIONAL]: Preservamos el código fuente para despliegues Bare-Metal que usa el backend
    - task: CopyFiles@2
      displayName: 'Copiar código para despliegues Bare-Metal'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          docker-compose*.yml
          requirements*.txt
          src/**
        TargetFolder: '$(Build.ArtifactStagingDirectory)/deploy-info'
        CleanTargetFolder: false

    # [ESTANDARIZACIÓN 3]: Publicación para el CD
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/deploy-info'
        ArtifactName: 'deploy-info'
      displayName: 'Publicar artefacto deploy-info'

    # [ESTANDARIZACIÓN 4]: Limpieza de sesión
    - bash: |
        docker logout dockermg-g9hrgcc4etdrh8eg.azurecr.io || true
        docker rmi $IMAGE_NAME:$UNIQUE_TAG $IMAGE_NAME:$ENV_TAG || true
        docker image prune -f
      displayName: 'Cerrar sesión de ACR y Limpiar entorno'
      env:
        IMAGE_NAME: $(imageName)
        UNIQUE_TAG: $(uniqueTag)
        ENV_TAG: $(envTag)
      condition: always()
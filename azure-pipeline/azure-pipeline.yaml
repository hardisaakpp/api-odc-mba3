trigger:
  branches:
    include:
      - main
      - test
      - ci/*
      - feature/*
      - fix/*
      - bugfix/*
      - hotfix/*

pool:
  name: 'agents-srv-test'
  demands:
    - Agent.OS -equals Linux

variables:
  pythonVersion: '3.11' # Asegúrate de que esta versión esté instalada en el servidor

stages:
- stage: Build_and_Publish
  displayName: 'Preparar y Publicar Código Fuente'
  jobs:
  - job: Publish_Drop
    displayName: 'Empaquetar Artefacto Python'
    steps:
    
    # 1. (Opcional) Aquí podrías correr tests o linters
    - script: |
        echo "Validando sintaxis..."
        python3 -m py_compile src/**/*.py
      displayName: 'Validación rápida de código'
      continueOnError: true

    # 2. Copiar solo los archivos necesarios para producción a un directorio temporal
    - task: CopyFiles@2
      displayName: 'Copiar archivos al Staging Directory'
      inputs:
        SourceFolder: '$(Build.SourcesDirectory)'
        Contents: |
          src/**
          requirements.txt
          requirements-dev.txt
        TargetFolder: '$(Build.ArtifactStagingDirectory)/drop'
        CleanTargetFolder: true

    # 3. Publicar la carpeta 'drop' en Azure DevOps
    - task: PublishBuildArtifacts@1
      displayName: 'Publicar Artefacto (Drop)'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/drop'
        ArtifactName: 'api-odc-mba3-drop'
        publishLocation: 'Container'
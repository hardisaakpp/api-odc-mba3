# CI en GitHub: solo validación (no modifica el código). Ruff corre sobre los .py tocados
# en el PR o en el push; pytest smoke sobre un subconjunto estable.
# La imagen Docker de producción sigue usando solo requirements.txt (sin requirements-dev).

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-changed-python:
    name: Ruff (archivos Python tocados)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff>=0.8.0"

      - name: Ruff on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "${BASE_REF}" --depth=200
            mapfile -t FILES < <(git diff --name-only "origin/${BASE_REF}...${PR_HEAD_SHA}" -- 'src/**/*.py' 'tests/**/*.py' 'scripts/**/*.py' || true)
          else
            BASE="${BEFORE_SHA:-}"
            HEAD="${HEAD_SHA}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              git fetch origin "${DEFAULT_BRANCH}" --depth=200
              mapfile -t FILES < <(git diff --name-only "FETCH_HEAD" "${HEAD}" -- 'src/**/*.py' 'tests/**/*.py' 'scripts/**/*.py' || true)
            else
              mapfile -t FILES < <(git diff --name-only "${BASE}" "${HEAD}" -- 'src/**/*.py' 'tests/**/*.py' 'scripts/**/*.py' || true)
            fi
          fi
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No hay archivos .py modificados bajo src/, tests/ o scripts/. Nada que verificar con Ruff."
            exit 0
          fi
          printf '%s\n' "${FILES[@]}"
          ruff check "${FILES[@]}"

  test-smoke:
    name: Pytest (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run smoke tests
        run: pytest -q tests/test_retry_utils.py tests/test_sap_client.py

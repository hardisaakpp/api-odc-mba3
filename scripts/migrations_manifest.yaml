# ============================================================================
# Manifest de Migraciones - Orden de Ejecución
# ============================================================================
# Cada migración se ejecuta una sola vez en el orden especificado.
# NO modificar versiones ya aplicadas en producción.
# Para agregar nuevas migraciones, agregar al final con versión incremental.
# ============================================================================

migrations:
  # Base: Tablas fundamentales
  - version: "001"
    name: "create_despacho_tables"
    file: "create_producto_staging_tables.sql"
    description: "Crear tablas de staging para productos"
    category: "base"

  - version: "002"
    name: "create_sap_tables"
    file: "create_sap_tables.sql"
    description: "Crear tablas para cache de productos SAP"
    category: "base"

  - version: "003"
    name: "create_sku_homologacion"
    file: "create_sku_homologacion_table.sql"
    description: "Crear tabla de homologación de SKUs"
    category: "base"

  - version: "004"
    name: "create_pedido_tables"
    file: "create_pedido_tables.sql"
    description: "Crear tablas principales de pedidos"
    category: "base"
    dependencies: []

  - version: "005"
    name: "create_pedido_estado_table"
    file: "create_pedido_estado_table.sql"
    description: "Crear tabla maestra de estados de pedido"
    category: "base"
    dependencies: ["004"]

  - version: "006"
    name: "create_distribucion_confirmada"

  #   describía ya había ocurrido por otra vía en el commit 4123e8b ("ESTADO
  #   redistribucion", 2026-02-03), que actualizó pedido_estados.py y
  #   migrate_pedido_estado_id.sql. La BD real (dev) ya coincide con el estado
  #   destino de este script -- correrlo ahora habría corrompido pedido.estado_id
  #   de pedidos reales en "GESTIONAR PEDIDO".
  # - 501/502 (configure_sap_linked_server[_alternative]): el linked server
  #   MYHANADB ya existe y funciona en el servidor SAP real (SRV-FABRICA/
  #   STORECONTROL, vía SQL_SERVER_SAP_SERVER), configurado con un DSN que no
  #   coincide con ninguno de los dos scripts (ambos usan IP cruda). Correr
  #   cualquiera habría hecho sp_dropserver sobre la configuración que hoy
  #   funciona. Ninguno de los dos apuntaba siquiera al servidor correcto desde
  #   este migration_runner (que solo conecta al servidor principal, no al SAP).
  # No versionar reemplazos con estos números -- quedan retirados permanentemente.

  # Ajustes de esquema - solo si se necesita revertir cambios
  - version: "601"
    name: "remove_bodega_column"

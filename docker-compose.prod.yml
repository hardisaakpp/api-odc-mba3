# Overlay de producción — srv-mabuiosapi (/opt/odc-sap)
#
# MinIO NO corre en este host. Almacenamiento en srv-mabuiosbdo (192.168.2.211:9100).
# Variables de negocio en /opt/odc-sap/.env (ENV_FILE=/app/.env).
#
# Uso (tras parar systemd y redis-server nativo; ver docs/DEPLOY_DOCKER_PRODUCCION.md):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#   ./deploy-prod.sh
#   ./scripts/docker-app-up-prod.sh -Build

x-app-prod: &app-prod
  environment:
    ENVIRONMENT: production
    ENV_FILE: /app/.env
    REDIS_URL: redis://redis:6379/0
    FILE_STORAGE_ENDPOINT: http://192.168.2.211:9100
  env_file:
    - .env
  volumes:
    - ./.env:/app/.env:ro
  # docker-compose.yml declara "minio" como dependencia (perfil "app", storage
  # siempre activo en dev); acá se quita porque el MinIO embebido está
  # desactivado en este host (ver nota junto al servicio "minio" abajo).
  depends_on:
    minio: !reset null

services:
  redis:
    mem_limit: 256m

  # El MinIO embebido de docker-compose.yml es solo para desarrollo local: en
  # este host el storage real es externo (192.168.2.211), así que se desactiva
  # devolviéndolo a un perfil que --profile app no activa. "profiles" es una
  # lista y Compose la fusiona (concatena) por defecto -- se necesita
  # "!override" para reemplazarla en vez de sumarle "app" de docker-compose.yml.
  minio:
    profiles: !override
      - bundled-minio-dev-only

  api:
    <<: *app-prod
    mem_limit: 512m
    volumes:
      - ./.env:/app/.env:ro
      - /opt/odc-sap/logs:/app/logs

  celery-worker:
    <<: *app-prod
    mem_limit: 800m
    volumes:
      - ./.env:/app/.env:ro
      - /opt/odc-sap/logs:/app/logs

  celery-beat:
    <<: *app-prod
    mem_limit: 256m
    volumes:
      - ./.env:/app/.env:ro
      - celerybeat_data:/var/lib/celery
      - /opt/odc-sap/logs:/app/logs

# Override para despliegue en servidores (test/prod) usando imagen de ACR.
# No compila nada en el servidor: solo pull de la imagen.
#
# Uso (lo ejecuta el release de Azure DevOps):
#   export IMAGE_TAG=test-<BuildId>
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml --profile app up -d
#
# Variables opcionales por ambiente (exportadas por el release; entre paréntesis el default):
#   ENVIRONMENT          -> test | production        (test)
#   CELERY_CONCURRENCY   -> procesos del worker      (2)
#   API_MEM_LIMIT        -> memoria máx API          (512m)
#   WORKER_MEM_LIMIT     -> memoria máx worker       (800m)
#   BEAT_MEM_LIMIT       -> memoria máx beat         (256m)
#   REDIS_MEM_LIMIT      -> memoria máx redis        (256m)

x-deploy-common: &deploy-common
  image: ${ACR_LOGIN_SERVER:-dockermg-g9hrgcc4etdrh8eg.azurecr.io}/api-odc-mba3:${IMAGE_TAG:-test-latest}
  build: !reset null
  environment:
    ENVIRONMENT: ${ENVIRONMENT:-test}
    REDIS_URL: redis://redis:6379/0
    FILE_STORAGE_ENDPOINT: ${FILE_STORAGE_ENDPOINT}
  env_file:
    - /opt/odc-sap/.env
  # docker-compose.yml declara "minio" como dependencia (perfil "app", storage
  # siempre activo en dev); acá se quita porque el MinIO embebido está
  # desactivado en este host (ver nota junto al servicio "minio" abajo).
  depends_on:
    minio: !reset null

services:
  redis:
    ports: !reset []   # No publicar 6379: hay un Redis nativo en el host
    mem_limit: ${REDIS_MEM_LIMIT:-256m}

  # El MinIO embebido de docker-compose.yml es solo para desarrollo local: en
  # test/prod el storage real es externo (FILE_STORAGE_ENDPOINT lo apunta ahí),
  # así que se desactiva devolviéndolo a un perfil que --profile app no activa.
  # "profiles" es una lista y Compose la fusiona (concatena) por defecto -- se
  # necesita "!override" para reemplazarla en vez de sumarle "app".
  minio:
    profiles: !override
      - bundled-minio-dev-only

  api:
    <<: *deploy-common
    mem_limit: ${API_MEM_LIMIT:-512m}
    volumes:
      - /opt/odc-sap/.env:/app/.env:ro
      - /opt/odc-sap/.env:/app/.env.${ENVIRONMENT:-test}:ro
      - /opt/odc-sap/logs:/app/logs

  celery-worker:
    <<: *deploy-common
    mem_limit: ${WORKER_MEM_LIMIT:-800m}
    command:
      [
        "celery",
        "-A",
        "src.celery_app",
        "worker",
        "--loglevel=info",
        "--pool=prefork",
        "--concurrency=${CELERY_CONCURRENCY:-2}",
        "--max-tasks-per-child=50",
      ]
    volumes:
      - /opt/odc-sap/.env:/app/.env:ro
      - /opt/odc-sap/.env:/app/.env.${ENVIRONMENT:-test}:ro
      - /opt/odc-sap/logs:/app/logs

  celery-beat:
    <<: *deploy-common
    mem_limit: ${BEAT_MEM_LIMIT:-256m}
    volumes:
      - /opt/odc-sap/.env:/app/.env:ro
      - /opt/odc-sap/.env:/app/.env.${ENVIRONMENT:-test}:ro
      - celerybeat_data:/var/lib/celery